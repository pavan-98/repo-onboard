# Publishes to npm when a GitHub release is published.
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret is stored in the repo.
# One-time setup on npmjs.com → repo-onboard → Settings → Trusted publishing:
#   GitHub Actions · owner pavan-98 · repo repo-onboard · workflow release.yml
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm version that supports trusted publishing
        run: npm install -g npm@latest
      - run: npm ci
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
